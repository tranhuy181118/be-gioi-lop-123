<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bé Giỏi Mỗi Ngày - App Học Tập Cho Bé Lớp 1, 2, 3</title><style>:root{--primary:#4f46e5;--primary-hover:#4338ca;--secondary:#ec4899;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--background:#f0fdf4;--card-bg:#ffffff;--text-main:#1f2937;--avatar-border-color:#4f46e5}*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}body{background-color:var(--background);color:var(--text-main);padding-bottom:40px;user-select:none}header{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}.logo{font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:8px}.user-profile-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);padding:4px 10px 4px 4px;border-radius:30px;cursor:pointer;backdrop-filter:blur(5px);transition:all .2s}.user-profile-btn:hover{background:rgba(255,255,255,.35)}.avatar-circle{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:3px solid var(--avatar-border-color);overflow:hidden;flex-shrink:0}.avatar-circle img{width:100%;height:100%;object-fit:cover}.user-stats{display:flex;align-items:center;gap:8px}.stat-badge{background:rgba(255,255,255,.2);backdrop-filter:blur(5px);padding:6px 12px;border-radius:20px;font-weight:700;display:flex;align-items:center;gap:6px;font-size:1rem}.btn-icon{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 10px;border-radius:12px;cursor:pointer;font-size:1.1rem;transition:all .2s}.btn-icon:hover{background:rgba(255,255,255,.35)}.container{max-width:900px;margin:20px auto;padding:0 12px}.greeting-card{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;padding:16px 20px;border-radius:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:0 8px 16px rgba(236,72,153,.25)}.nav-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}.tab-btn{flex:1;min-width:110px;padding:10px 8px;border:none;background:#e2e8f0;color:#475569;font-weight:700;border-radius:12px;cursor:pointer;transition:all .2s;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px}.tab-btn.active{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(79,70,229,.3)}.card{background:var(--card-bg);border-radius:20px;padding:20px;box-shadow:0 10px 15px -3px rgba(0,0,0,.05);margin-bottom:20px;position:relative}.grade-selector{display:flex;gap:8px;margin-bottom:16px;justify-content:center}.grade-btn{padding:6px 16px;border:2px solid #cbd5e1;border-radius:20px;background:#fff;cursor:pointer;font-weight:700;color:#64748b}.grade-btn.active{border-color:var(--primary);background:#e0e7ff;color:var(--primary)}.mode-selector{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px}@media (min-width:640px){.mode-selector{grid-template-columns:repeat(4,1fr)}}.mode-btn{padding:10px 6px;border:2px solid #e2e8f0;border-radius:12px;background:#f8fafc;cursor:pointer;font-size:.9rem;font-weight:700;color:#475569;text-align:center}.mode-btn.active{background:var(--secondary);color:#fff;border-color:var(--secondary);box-shadow:0 4px 10px rgba(236,72,153,.25)}.combo-badge{position:absolute;top:15px;right:20px;background:#fff7ed;color:#c2410c;border:2px solid #ffedd5;padding:4px 12px;border-radius:20px;font-weight:800;font-size:.95rem}.question-box{text-align:center;margin:15px 0}.question-text{font-size:1.5rem;font-weight:700;color:#1e293b;margin-bottom:20px;min-height:50px;display:flex;align-items:center;justify-content:center}.options-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media (max-width:500px){.options-grid{grid-template-columns:1fr}}.option-btn{padding:16px;border:2px solid #e2e8f0;background:#fff;border-radius:14px;font-size:1.15rem;font-weight:700;cursor:pointer;transition:all .2s;color:#334155}.option-btn:hover:not(:disabled){border-color:var(--primary);background:#f5f3ff}.option-btn.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#15803d!important}.option-btn.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#b91c1c!important}.balloon-arena{height:280px;background:linear-gradient(to bottom,#bae6fd,#e0f2fe);border-radius:16px;position:relative;overflow:hidden;border:2px dashed #0284c7;margin-top:15px}.balloon{position:absolute;width:75px;height:90px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.1rem;cursor:pointer;box-shadow:inset -5px -5px 10px rgba(0,0,0,.15);transition:transform .1s}.balloon::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-width:6px 5px 0 5px;border-style:solid;border-color:inherit}.balloon.popped{transform:scale(0)!important;opacity:0;transition:all .2s ease-out}.boss-arena{background:linear-gradient(135deg,#1e1b4b,#311b92);border-radius:16px;padding:20px;color:#fff;margin-bottom:15px}.arena-fighters{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.fighter{text-align:center;width:45%}.fighter-avatar{font-size:3.5rem;height:70px;display:flex;align-items:center;justify-content:center}.health-bar-bg{background:rgba(255,255,255,.2);height:14px;border-radius:10px;overflow:hidden;margin-top:6px}.health-bar-fill{height:100%;background:#22c55e;width:100%;transition:width .3s}.race-track{background:#334155;border-radius:16px;padding:15px 10px;margin-bottom:15px;display:flex;flex-direction:column;gap:12px;border:3px solid #1e293b}.lane{background:#475569;height:50px;border-radius:25px;position:relative;border:2px dashed #94a3b8}.car-runner{position:absolute;top:50%;transform:translateY(-50%);left:0;transition:left .4s ease-out;display:flex;align-items:center;gap:4px}.finish-line{position:absolute;right:15px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(0deg,#fff,#fff 8px,#000 8px,#000 16px);border-radius:2px}.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}.shop-item{border:1px solid #e2e8f0;border-radius:16px;padding:15px;text-align:center;background:#fff;display:flex;flex-direction:column;justify-content:space-between}.shop-item-icon{font-size:2.8rem;margin-bottom:8px}.buy-btn{background:var(--primary);color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer}.buy-btn:disabled{background:#cbd5e1;cursor:not-allowed}.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;z-index:200;padding:15px;backdrop-filter:blur(3px)}.modal{background:#fff;border-radius:24px;padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}.form-group{margin-bottom:15px}.form-group label{display:block;font-weight:700;margin-bottom:6px;color:#334155}.form-group input{width:100%;padding:10px 14px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1rem}.btn{padding:10px 18px;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:all .2s}.btn-primary{background:var(--primary);color:#fff}.btn-secondary{background:#64748b;color:#fff}.btn-danger{background:var(--danger);color:#fff}.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}.avatar-option{font-size:2rem;padding:10px;border:2px solid #e2e8f0;border-radius:14px;cursor:pointer;text-align:center;position:relative}.avatar-option.selected{border-color:var(--primary);background:#e0e7ff}.avatar-option.locked{opacity:.6;background:#f1f5f9}.color-picker-grid{display:flex;gap:10px;margin-top:8px}.color-circle{width:32px;height:32px;border-radius
