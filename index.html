<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bé Giỏi Mỗi Ngày</title><style>:root{--primary:#4f46e5;--secondary:#ec4899;--background:#f0fdf4}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}body{background-color:var(--background);color:#1f2937;padding-bottom:40px;user-select:none}header{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.logo{font-size:1.3rem;font-weight:700}.user-stats{display:flex;align-items:center;gap:8px}.stat-badge{background:rgba(255,255,255,.2);padding:6px 12px;border-radius:20px;font-weight:700}.avatar-circle{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;border:2px solid #fff;overflow:hidden}.avatar-circle img{width:100%;height:100%;object-fit:cover}.container{max-width:800px;margin:20px auto;padding:0 12px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:20px;position:relative}.greeting-card{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;padding:16px;border-radius:20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.nav-tabs{display:flex;gap:8px;margin-bottom:16px}.tab-btn{flex:1;padding:10px;border:none;background:#e2e8f0;font-weight:700;border-radius:12px;cursor:pointer}.tab-btn.active{background:var(--primary);color:#fff}.grade-selector{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.grade-btn{padding:6px 16px;border:2px solid #cbd5e1;border-radius:20px;background:#fff;cursor:pointer;font-weight:700}.grade-btn.active{border-color:var(--primary);background:#e0e7ff;color:var(--primary)}.mode-selector{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.mode-btn{padding:8px;border:2px solid #e2e8f0;border-radius:12px;background:#f8fafc;cursor:pointer;font-weight:700;text-align:center;font-size:.85rem}.mode-btn.active{background:var(--secondary);color:#fff;border-color:var(--secondary)}.question-box{text-align:center;margin:20px 0}.question-text{font-size:1.6rem;font-weight:700;margin-bottom:20px}.options-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option-btn{padding:16px;border:2px solid #e2e8f0;background:#fff;border-radius:14px;font-size:1.2rem;font-weight:700;cursor:pointer}.option-btn.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#15803d!important}.option-btn.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#b91c1c!important}.hidden{display:none!important}.btn{padding:8px 16px;border:none;border-radius:10px;font-weight:700;cursor:pointer}.btn-primary{background:var(--primary);color:#fff}.btn-secondary{background:#64748b;color:#fff}.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:center;z-index:200}.modal{background:#fff;padding:20px;border-radius:20px;width:90%;max-width:400px}.form-group{margin-bottom:12px}.form-group label{display:block;font-weight:700;margin-bottom:4px}.form-group input{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}</style></head><body><header><div class="logo">🐝 Bé Giỏi</div><div class="user-stats"><div class="avatar-circle" id="header-avatar" onclick="openAvatarModal()">🧒</div><span id="header-name" style="font-weight:700" onclick="openAvatarModal()">Bé</span><div class="stat-badge">⭐ <span id="star-count">0</span></div></div></header><div class="container"><div class="greeting-card" onclick="openAvatarModal()"><div><h2 id="greeting-title">Xin chào, Bé! 👋</h2><p style="font-size:.9rem">Cùng chăm chỉ học bài để tích sao nhé!</p></div><div style="font-size:1.5rem">✏️</div></div><div class="nav-tabs"><button class="tab-btn active" onclick="selectSubject('math')">🧮 Toán</button><button class="tab-btn" onclick="selectSubject('vietnamese')">📖 Tiếng Việt</button><button class="tab-btn" onclick="selectSubject('english')">🇬🇧 Tiếng Anh</button></div><div id="study-panel" class="card"><div class="grade-selector"><button class="grade-btn active" onclick="selectGrade(1)">Lớp 1</button><button class="grade-btn" onclick="selectGrade(2)">Lớp 2</button><button class="grade-btn" onclick="selectGrade(3)">Lớp 3</button></div><div class="mode-selector"><button class="mode-btn active" onclick="selectMode('quiz')">📝 Làm Bài</button><button class="mode-btn" onclick="selectMode('balloon')">🎈 Bắn Bóng</button><button class="mode-btn" onclick="selectMode('boss')">👾 Đánh Quái</button><button class="mode-btn" onclick="selectMode('race')">🏎️ Đua Xe</button></div><div class="question-box"><div class="question-text" id="question-text">Đang tải câu hỏi...</div><div class="options-grid" id="options-grid"></div></div></div></div><div id="avatar-modal" class="modal-overlay hidden"><div class="modal"><h3>👤 Đổi Tên & Avatar</h3><div class="form-group" style="margin-top:15px"><label>Tên của bé:</label><input type="text" id="edit-name" placeholder="Nhập tên bé..."></div><div class="form-group"><label>Tải ảnh làm Avatar:</label><input type="file" accept="image/*" onchange="uploadAvatar(event)"></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:15px"><button class="btn btn-secondary" onclick="closeModal()">Đóng</button><button class="btn btn-primary" onclick="saveProfile()">Lưu</button></div></div></div><script>let userData={stars:0,name:"Bé",avatarImg:null,avatarEmoji:"🧒"},currentSubject="math",currentGrade=1,currentQuestion=null,isAnswering=!1;function saveData(){localStorage.setItem("be_gioi_data",JSON.stringify(userData)),updateUI()}function updateUI(){document.getElementById("star-count").innerText=userData.stars,document.getElementById("header-name").innerText=userData.name,document.getElementById("greeting-title").innerText="Xin chào, "+userData.name+"! 👋";let e=document.getElementById("header-avatar");userData.avatarImg?e.innerHTML='<img src="'+userData.avatarImg+'">':e.innerText=userData.avatarEmoji}function selectSubject(e){currentSubject=e;let t=document.querySelectorAll(".nav-tabs .tab-btn");t.forEach((t,a)=>t.classList.toggle("active","math"===e&&0===a||"vietnamese"===e&&1===a||"english"===e&&2===a)),loadQuestion()}function selectGrade(e){currentGrade=e;let t=document.querySelectorAll(".grade-btn");t.forEach((t,a)=>t.classList.toggle("active",a===e-1)),loadQuestion()}function selectMode(e){let t=document.querySelectorAll(".mode-btn");t.forEach((t,a)=>t.classList.toggle("active","quiz"===e&&0===a||"balloon"===e&&1===a||"boss"===e&&2===a||"race"===e&&3===a)),loadQuestion()}function loadQuestion(){if(isAnswering=!1,"math"===currentSubject){let e=Math.floor(Math.random()*10*currentGrade)+1,t=Math.floor(Math.random()*10*currentGrade)+1,a=e+t,r=[a,a+2,a-1,a+3].sort(()=>Math.random()-.5);currentQuestion={q:e+" + "+t+" = ?",opts:r.map(String),ans:String(a)}}else"vietnamese"===currentSubject?currentQuestion={q:'Điền vần thích hợp: "Con m___"',opts:["èo","ào","êu","iu"],ans:"èo"}:currentQuestion={q:'"Con Mèo" tiếng Anh là gì?',opts:["Cat","Dog","Bird","Fish"],ans:"Cat"};document.getElementById("question-text").innerText=currentQuestion.q;let e=document.getElementById("options-grid");e.innerHTML="",currentQuestion.opts.forEach(t=>{let a=document.createElement("button");a.className="option-btn",a.innerText=t,a.onclick=function(){checkAns(t,a)},e.appendChild(a)})}function checkAns(e,t){isAnswering||(isAnswering=!0,e===currentQuestion.ans?(t.classList.add("correct"),userData.stars+=10,saveData(),setTimeout(loadQuestion,1e3)):(t.classList.add("wrong"),setTimeout(loadQuestion,1500)))}function openAvatarModal(){document.getElementById("edit-name").value=userData.name,document.getElementById("avatar-modal").classList.remove("hidden")}function closeModal(){document.getElementById("avatar-modal").classList.add("hidden")}function uploadAvatar(e){let t=e.target.files[0];if(t){let e=new FileReader;e.onload=function(e){userData.avatarImg=e.target.result},e.readAsDataURL(t)}}function saveProfile(){let e=document.getElementById("edit-name").value.trim();userData.name=e||"Bé",saveData(),closeModal()}window.onload=function(){let e=localStorage.getItem("be_gioi_data");e&&(userData=JSON.parse(e)),updateUI(),loadQuestion()};</script></body></html>
