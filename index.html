<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bé Giỏi Mỗi Ngày - App Học Tập Cho Bé Lớp 1, 2, 3</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #ec4899;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --background: #f0fdf4;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --avatar-border-color: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text-main);
      padding-bottom: 40px;
      user-select: none;
    }

    header {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-profile-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px 4px 4px;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s;
    }

    .user-profile-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .avatar-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      border: 3px solid var(--avatar-border-color);
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-stats {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1rem;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 12px;
    }

    .greeting-card {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      padding: 16px 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(236, 72, 153, 0.25);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      flex: 1;
      min-width: 110px;
      padding: 10px 8px;
      border: none;
      background: #e2e8f0;
      color: #475569;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      position: relative;
    }

    .grade-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .grade-btn {
      padding: 6px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-weight: bold;
      color: #64748b;
    }

    .grade-btn.active {
      border-color: var(--primary);
      background: #e0e7ff;
      color: var(--primary);
    }
